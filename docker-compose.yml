# Local stack: PostgreSQL 16 + Redis 7 + the Kerno (SoftPOS) server.
#
# No secrets live in this file. Copy the template and fill every CHANGE_ME:
#
#   cp .env.example .env   # git-ignored
#   docker compose up --build
#
# DEV_MODE is off unless you set DEV_MODE=true in your own .env (local demo
# only). Database and Redis ports are bound to 127.0.0.1, never public.
services:
  postgres:
    image: postgres:16-alpine
    container_name: softpos-postgres
    environment:
      POSTGRES_DB: softpos
      POSTGRES_USER: softpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softpos -d softpos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: softpos-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  softpos-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softpos-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # All configuration and secrets come from .env (template: .env.example).
    env_file: .env
    environment:
      # Non-secret container wiring only.
      PORT: "8080"
      STATIC_DIR: /app/web/pos
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
