services:
  postgres:
    image: postgres:16-alpine
    container_name: softpos-postgres
    environment:
      POSTGRES_DB: softpos
      POSTGRES_USER: softpos_user
      POSTGRES_PASSWORD: softpos_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softpos_user -d softpos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: softpos-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  softpos-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softpos-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://softpos_user:softpos_secure_password@postgres:5432/softpos?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      STP_HMAC_SECRET: "softpos_prod_hmac_secret_key"
      VAULT_MASTER_KEY_HEX: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
      SEED_DEMO_MERCHANT: "true"
      STATIC_DIR: "/app/web/pos"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
